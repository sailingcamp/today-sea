<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日の海</title>
<meta name="theme-color" content="#0ea5c6">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
<section class="hero">
  <p class="label">海育プロジェクト</p>
  <h1>今日の海</h1>

  <div class="hero-main">
    <div>
      <p class="place" id="placeName">葉山</p>
      <p class="time" id="currentTime">--</p>
      <p class="status" id="statusText">海の状況を確認しています</p>
    </div>

    <div class="sea-score-box">
      <p class="score-label">今日の海スコア</p>
      <p class="score-value"><span id="seaScore">--</span><span class="score-unit">点</span></p>
      <p class="score-text" id="seaScoreText">判定中</p>
    </div>
  </div>

<div class="buttons">
  <select id="locationSelect">
    <option value="hayama">葉山（Ｅ海面）</option>
    <option value="enoshima">江の島（Ｂ１海面）</option>
  </select>
</div>
  
<section class="dashboard">
<div class="card">
  <h2>風速（平均/最大）</h2>
  <p class="main-value" id="windSpeed">--</p>
  <p class="unit">m/s</p>
</div>

      <div class="card">
        <h2>風向</h2>
        <p class="main-value" id="windDirection">--</p>
        <p class="unit" id="windDirectionText">--</p>
      </div>

      <div class="card">
        <h2>気温</h2>
        <p class="main-value" id="temperature">--</p>
        <p class="unit">℃</p>
      </div>

<div class="card">
  <h2>降水（現在/3h後）</h2>

  <p class="main-value" id="precipitation">
    --
  </p>

  <p class="unit">
    %
  </p>
</div>

      <div class="card">
        <h2>波高</h2>
        <p class="main-value" id="waveHeight">--</p>
        <p class="unit">m</p>
      </div>

<div class="card">
  <h2>活動時間</h2>

  <p class="main-value" id="sunsetCountdown">
    --
  </p>

  <p class="unit" id="sunset">
    --
  </p>
</div>
 
</section>

    <section class="memo-card">
      <h2>海育メモ</h2>
      <p id="memoText">海の状況を確認しています。</p>
    </section>

  <section class="note">
  <p style="color:red;font-size:24px;">
    TEST TEST TEST
  </p>
</section>
  
    <section class="chart-card">
      <h2>風速予測 これから5時間</h2>
      <canvas id="windSpeedChart" width="600" height="240"></canvas>
    </section>

    <section class="chart-card">
      <h2>風向変化 これから5時間</h2>
      <canvas id="windDirectionChart" width="600" height="240"></canvas>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>

</body>
</html>
